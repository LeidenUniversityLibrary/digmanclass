name: Test build

on:
  pull_request:

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Use GitHub Actions' cache to shorten build times and decrease load on servers
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    # Standard usage
    - run: bundle exec jekyll build
